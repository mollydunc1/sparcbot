# =============================================================================
# SPARCBot parameters — the ONE place every robot value lives.
#
# Read by:
#   * the ROS 2 nodes (passed in by sparcbot_bringup/launch/robot.launch.py)
#
# Nested keys become dotted parameter names, e.g. left_motor.gpio_dir.
#
# Rules of thumb:
#   * Write every floating-point value with a decimal point (1.0, not 1).
# =============================================================================

# -----------------------------------------------------------------------------
# Hardware driver: motors, encoders, wheel-state estimator.
# -----------------------------------------------------------------------------
sparcbot_driver:
  ros__parameters:
    control_rate_hz: 100.0      # encoder read + /wheel_states publish rate
    cmd_timeout_s: 0.1          # coast if no /wheel_cmd for this long (<= 0 disables)

    wheel_radius_m: 0.050
    counts_per_rev: 500.0       # encoder counts per gearbox output revolution
    velocity_cutoff_hz: 8.0     # first-order low-pass on wheel velocity (<= 0 disables)

    # Wiring. Signs make "positive command" and "positive
    # encoder motion" both mean robot-forward wheel motion.
    left_motor:
      name: left
      gpio_dir: 23
      gpio_ps: 24
      gpio_enc_a: 17
      gpio_enc_b: 27
      pwm_chip: 0
      pwm_channel: 0
      pwm_frequency_hz: 20000
      motor_sign: -1
      encoder_sign: 1

    right_motor:
      name: right
      gpio_dir: 22
      gpio_ps: 25
      gpio_enc_a: 5
      gpio_enc_b: 6
      pwm_chip: 0
      pwm_channel: 1
      pwm_frequency_hz: 20000
      motor_sign: 1
      encoder_sign: -1

# -----------------------------------------------------------------------------
# Robot geometry shared by every node
# -----------------------------------------------------------------------------
/**:
  ros__parameters:
    base_width_m: 0.175         # wheel-to-wheel distance (measure on your robot)

# -----------------------------------------------------------------------------
# Wheel velocity controller (feedforward + PID), one block per wheel.
# -----------------------------------------------------------------------------
wheel_controller:
  ros__parameters:
    # CSV file for WheelController.log() (call it inside compute()); '' disables logging.
    # Use an absolute path, e.g. /home/sparcbot/logs/ff_sweep.csv
    log_file: ''

    left:
      kp: 0.0
      ki: 0.0
      kd: 0.0
      feedforward:
        forward_static: 0.0
        forward_velocity_gain: 0.0
        reverse_static: 0.0
        reverse_velocity_gain: 0.0
        forward_breakaway: 0.0
        reverse_breakaway: 0.0
        stopped_velocity_threshold: 0.025
        max_command: 1.0
        zero_velocity_threshold: 0.0005

    right:
      kp: 0.0
      ki: 0.0
      kd: 0.0
      feedforward:
        forward_static: 0.0
        forward_velocity_gain: 0.0
        reverse_static: 0.0
        reverse_velocity_gain: 0.0
        forward_breakaway: 0.0
        reverse_breakaway: 0.0
        stopped_velocity_threshold: 0.025
        max_command: 1.0
        zero_velocity_threshold: 0.0005